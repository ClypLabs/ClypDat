name: ClypDat Dev channel

on:
  workflow_dispatch:
    inputs:
      avalonia_commit:
        description: Avalonia fork commit that produced the package artifact
        required: true
        type: string
      package_version:
        description: Exact Avalonia package-set version
        required: true
        type: string
      avalonia_run_id:
        description: Avalonia Actions run ID containing the immutable artifact
        required: true
        type: string
      artifact_name:
        description: Immutable Avalonia artifact name
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clypdat-dev-channel
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Dispatch inputs are attacker-controlled for anyone who can trigger this
      # workflow. Validate their shape once, here, in a step that holds no secrets -
      # and pass them to every later step through env: rather than interpolating
      # ${{ inputs.* }} into a run: block, which splices caller text into the script.
      - name: Validate dispatch inputs
        shell: pwsh
        env:
          AVALONIA_COMMIT: ${{ inputs.avalonia_commit }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          AVALONIA_RUN_ID: ${{ inputs.avalonia_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          if ($env:AVALONIA_COMMIT -notmatch '^[0-9a-f]{40}$') { throw "avalonia_commit must be a full 40-character git SHA." }
          if ($env:PACKAGE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "package_version has an unexpected shape." }
          if ($env:AVALONIA_RUN_ID -notmatch '^[0-9]+$') { throw "avalonia_run_id must be numeric." }
          if ($env:ARTIFACT_NAME -notmatch '^[0-9A-Za-z._-]{1,128}$') { throw "artifact_name has an unexpected shape." }

      - name: Download exact Avalonia package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: avalonia-artifact
          repository: ClypLabs/clypdat-avalonia
          run-id: ${{ inputs.avalonia_run_id }}
          github-token: ${{ secrets.CLYPDAT_CI_CROSSREPO }}

      - name: Verify package manifest and package version
        shell: pwsh
        env:
          AVALONIA_COMMIT: ${{ inputs.avalonia_commit }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          Expand-Archive -LiteralPath (Get-ChildItem avalonia-artifact -Filter *.zip | Select-Object -First 1).FullName -DestinationPath avalonia-packages
          $manifest = Get-Content avalonia-packages/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:AVALONIA_COMMIT) { throw "Avalonia artifact commit mismatch." }
          if ($manifest.packageVersion -ne $env:PACKAGE_VERSION) { throw "Avalonia artifact package version mismatch." }
          foreach ($package in $manifest.packages) {
            $path = Join-Path avalonia-packages $package.name
            if (-not (Test-Path $path)) { throw "Missing package $($package.name)." }
            if ((Get-Item $path).Length -ne $package.size) { throw "Package size mismatch for $($package.name)." }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $package.sha256) { throw "Package hash mismatch for $($package.name)." }
          }

      - name: Bootstrap repo-local .NET SDK
        shell: pwsh
        run: .\dotnet.ps1 --info

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress --requirechecksums

      - name: Build and test current ClypDat master
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          .\dotnet.ps1 restore native\src\ClypDat.App\ClypDat.App.csproj --configfile NuGet.Dev.Config -r win-x64 -p:ClypDatAvaloniaPackageVersion=$env:PACKAGE_VERSION
          .\dotnet.ps1 build native\src\ClypDat.App\ClypDat.App.csproj -c Release -r win-x64 --no-restore -p:Platform=x64 -p:ClypDatChannel=Dev -p:ClypDatAvaloniaPackageVersion=$env:PACKAGE_VERSION

      - name: Publish self-contained Dev application
        id: publish
        shell: pwsh
        env:
          AVALONIA_COMMIT: ${{ inputs.avalonia_commit }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $clypdat = (git rev-parse HEAD).Trim()
          $avalonia = $env:AVALONIA_COMMIT
          $buildId = "$clypdat-$($avalonia.Substring(0, 7))"
          $payload = Join-Path $pwd "dev-payload\$buildId"
          New-Item -ItemType Directory -Force $payload | Out-Null
          .\dotnet.ps1 publish native\src\ClypDat.App\ClypDat.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:ClypDatChannel=Dev -p:ClypDatAvaloniaPackageVersion=$env:PACKAGE_VERSION -o $payload --nologo
          .\eng\Test-SelfContainedPublish.ps1 -PublishDirectory $payload
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          "clypdat_commit=$clypdat" >> $env:GITHUB_OUTPUT
          "avalonia_commit=$avalonia" >> $env:GITHUB_OUTPUT

      - name: Create signed manifest and Dev installer payload
        shell: pwsh
        env:
          CLYPDAT_DEV_SIGNING_PRIVATE_KEY: ${{ secrets.CLYPDAT_DEV_SIGNING_PRIVATE_KEY }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          BUILD_ID: ${{ steps.publish.outputs.build_id }}
          CLYPDAT_COMMIT: ${{ steps.publish.outputs.clypdat_commit }}
          AVALONIA_COMMIT: ${{ steps.publish.outputs.avalonia_commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLYPDAT_DEV_SIGNING_PRIVATE_KEY)) { throw "CLYPDAT_DEV_SIGNING_PRIVATE_KEY is not configured." }
          $buildId = $env:BUILD_ID
          $payload = Join-Path $pwd "dev-payload\$buildId"
          Compress-Archive -Path "$payload\*" -DestinationPath ClypDat-Dev.zip
          $archive = Get-Item ClypDat-Dev.zip
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1; buildId = $buildId; clypDatCommit = $env:CLYPDAT_COMMIT; avaloniaCommit = $env:AVALONIA_COMMIT;
            avaloniaPackageVersion = $env:PACKAGE_VERSION; buildIdSource = $buildId; buildNumber = [long]$env:GITHUB_RUN_NUMBER;
            archiveSize = $archive.Length; archiveSha256 = $hash; createdUtc = [DateTimeOffset]::UtcNow.ToString("O")
          }
          $manifestBytes = [Text.Encoding]::UTF8.GetBytes(($manifest | ConvertTo-Json -Depth 4 -Compress))
          [IO.File]::WriteAllBytes("ClypDat-Dev.manifest.json", $manifestBytes)
          $rsa = [Security.Cryptography.RSA]::Create(); $rsa.ImportFromPem($env:CLYPDAT_DEV_SIGNING_PRIVATE_KEY)
          $signature = $rsa.SignData($manifestBytes, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pss)
          # [Text.Encoding]::UTF8 emits a BOM, which is not valid base64 and does not
          # survive as whitespace on the reading side. The signature is plain ASCII.
          [IO.File]::WriteAllBytes("ClypDat-Dev.manifest.sig", [Text.Encoding]::ASCII.GetBytes([Convert]::ToBase64String($signature)))
          $launcher = Join-Path $pwd "dev-launcher"
          .\dotnet.ps1 publish native\src\ClypDat.DevLauncher\ClypDat.DevLauncher.csproj -c Release -r win-x64 --self-contained true -o $launcher --nologo
          $installerSource = Join-Path $pwd "dev-installer"
          New-Item -ItemType Directory -Force "$installerSource\versions\$buildId" | Out-Null
          Copy-Item "$launcher\ClypDat-Dev.exe" $installerSource
          Copy-Item "$payload\*" "$installerSource\versions\$buildId" -Recurse -Force
          Copy-Item "installer\License.txt" $installerSource
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DCLYPDAT_VERSION=0.0.0 /DCLYPDAT_BUILD_ID=$buildId /DCLYPDAT_SOURCE_DIR=$installerSource /DCLYPDAT_OUTPUT_FILE=$pwd\ClypDat-Dev-Setup.exe installer\ClypDat.Dev.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis.exe failed with exit code $LASTEXITCODE" }
          .\eng\Test-InstallerIcon.ps1 -InstallerPath .\ClypDat-Dev-Setup.exe -IconPath .\assets\clypdat-icon.ico

      - name: Publish moving signed Dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view dev 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create dev --prerelease --title "ClypDat Dev channel" --notes "Automated signed Dev builds." }
          gh release upload dev ClypDat-Dev.zip ClypDat-Dev.manifest.json ClypDat-Dev.manifest.sig ClypDat-Dev-Setup.exe --clobber
          gh release edit dev --target "${{ github.sha }}" --prerelease --title "ClypDat Dev channel"
