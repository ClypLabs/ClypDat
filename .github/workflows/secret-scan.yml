name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Keep default scanning; only ignore color-resource identifiers in ThemeRamp.
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
            [[rules]]
            id = "generic-api-key"
            [[rules.allowlists]]
            description = "Theme color resource names are identifiers, not credentials"
            condition = "AND"
            paths = ['''(^|[/\\])native[/\\]src[/\\]ClypDat\.App[/\\]Styles[/\\]ThemeRamp\.axaml$''']
            regexTarget = "secret"
            regexes = ['''^Surface_[0-9A-Fa-f]{6,8}$''']
