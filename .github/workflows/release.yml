name: Release
run-name: Bump version to ${{ inputs.version || github.ref_name }}

# Triggered by pushing a tag like v0.1.0. Builds the native win-x64 app and
# packages it four ways: a raw zip, a self-extracting portable exe, an NSIS
# setup.exe, and a raw MSI - then attaches all four to a GitHub Release for
# that tag. AppUpdateService.cs (in-app updater) specifically looks for the
# NSIS asset named ClypDat-Setup.exe, so that name must not change without
# also updating ExpectedAssetName there.
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the triggering tag)"
        required: false
      version:
        description: "Display version for manually dispatched releases"
        required: false

# Build code (NuGet/MSBuild targets, the fork build, choco packages) runs in a
# job whose token can only read. Only the final upload job can write releases,
# and it runs nothing but gh. Neither checkout persists its token into .git.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ runner.temp }}/clypdat-release-nuget
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # ClypDat consumes its patched Avalonia packages from the sibling fork.
      # A release runner is a clean checkout, so it must build that local feed
      # before restoring the app; otherwise NuGet fails with NU1301 because the
      # source named in NuGet.config does not exist yet.
      - name: Checkout Avalonia fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ClypLabs/clypdat-avalonia
          path: clypdat-avalonia
          fetch-depth: 0
          persist-credentials: false

      - name: Build pinned Avalonia packages
        shell: pwsh
        run: |
          $forkRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'clypdat-avalonia'
          Move-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'clypdat-avalonia') -Destination $forkRoot
          $pin = [xml](Get-Content -LiteralPath 'eng\AvaloniaPin.props' -Raw)
          $commit = $pin.SelectSingleNode('//ClypDatAvaloniaStableCommit').InnerText.Trim()
          git -C $forkRoot checkout --detach $commit
          if ($LASTEXITCODE -ne 0) { throw "Could not check out pinned Avalonia commit $commit." }
          .\eng\Build-ReleaseAvaloniaPackages.ps1 -AvaloniaRoot $forkRoot

      # Untrusted values reach PowerShell through env: only. Interpolating
      # ${{ inputs.* }} directly into a run: block splices the caller's text into
      # the script itself, so a dispatch input containing a quote can execute
      # arbitrary commands in a job that holds release secrets.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Refusing to build tag '$tag': expected vMAJOR.MINOR.PATCH."
          }
          $version = $tag.TrimStart("v")
          # .NET's $ also matches before a single trailing newline, so the pattern
          # above would accept "v1.0.0`n". A newline here would let the value inject
          # further keys into GITHUB_OUTPUT.
          if ($tag.Contains("`n") -or $tag.Contains("`r")) { throw "Tag contains a line break." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Bootstrap repo-local .NET SDK
        shell: pwsh
        run: .\dotnet.ps1 --info

      - name: Publish ClypDat.App
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\dotnet.ps1 publish native\src\ClypDat.App\ClypDat.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 "-p:Version=$env:VERSION" -o native\publish\win-x64-folder --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      - name: Verify self-contained publish
        shell: pwsh
        run: .\eng\Test-SelfContainedPublish.ps1 -PublishDirectory native\publish\win-x64-folder

      - name: Trim non-Windows runtime assets
        shell: pwsh
        run: |
          Get-ChildItem native\publish\win-x64-folder\runtimes -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "win-x64" } | Remove-Item -Recurse -Force

      - name: Build zip artifact
        shell: pwsh
        run: Compress-Archive -Path native\publish\win-x64-folder\* -DestinationPath ClypDat-win-x64.zip

      - name: Install packaging tools
        shell: pwsh
        run: |
          $requiredTools = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\7-Zip\7z.exe"
          )

          # Versions from successful release run 35196416795.
          $tools = @(
            @{ Name = 'nsis'; Version = '3.12.0' },
            @{ Name = 'wixtoolset'; Version = '3.14.1.20250415' },
            @{ Name = '7zip'; Version = '26.3.0' }
          )
          foreach ($tool in $tools) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco upgrade $tool.Name --version $tool.Version --allow-downgrade -y --no-progress --requirechecksums
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "Could not install pinned $($tool.Name) $($tool.Version)." }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (($requiredTools | Where-Object { -not (Test-Path $_) }).Count -ne 0) { throw 'Packaging tools are missing.' }

      - name: Build portable exe (7-Zip self-extracting archive)
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $sfxModule = "C:\Program Files\7-Zip\7z.sfx"
          & $sevenZip a -mx=5 payload.7z ".\native\publish\win-x64-folder\*"
          $configLines = @(
            ';!@Install@!UTF-8!',
            'Title="ClypDat"',
            'RunProgram="ClypDat.exe"',
            ';!@InstallEnd@!'
          )
          [System.IO.File]::WriteAllText("sfx-config.txt", ($configLines -join "`r`n"), [System.Text.Encoding]::UTF8)
          cmd /c copy /b "$sfxModule" + sfx-config.txt + payload.7z ClypDat-Portable.exe

      - name: Build NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DCLYPDAT_VERSION=$env:VERSION" /DCLYPDAT_SOURCE_DIR=..\native\publish\win-x64-folder /DCLYPDAT_OUTPUT_FILE=..\ClypDat-Setup.exe installer\ClypDat.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis.exe failed with exit code $LASTEXITCODE" }

      - name: Verify NSIS installer icon
        shell: pwsh
        run: .\eng\Test-InstallerIcon.ps1 -InstallerPath .\ClypDat-Setup.exe -IconPath .\assets\clypdat-icon.ico

      - name: Locate WiX toolset
        id: wix
        shell: pwsh
        run: |
          $candidate = "${env:WIX}bin"
          if (-not (Test-Path "$candidate\heat.exe")) {
            $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\heat.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $found) {
              $found = Get-ChildItem "C:\Program Files\WiX Toolset*\bin\heat.exe" -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }
            if (-not $found) { throw "Could not locate WiX Toolset's bin directory (heat.exe)." }
            $candidate = $found.DirectoryName
          }
          "bin=$candidate" >> $env:GITHUB_OUTPUT

      - name: Harvest publish folder for MSI
        shell: pwsh
        env:
          WIX_BIN: ${{ steps.wix.outputs.bin }}
        run: |
          $wixBin = $env:WIX_BIN
          $heatArgs = @(
            "dir", "native\publish\win-x64-folder",
            "-cg", "AppFiles", "-dr", "INSTALLFOLDER", "-srd", "-sreg", "-gg", "-g1", "-sfrag",
            "-var", "var.ClypDatSourceDir",
            "-out", "installer\AppFiles.wxs"
          )
          & "$wixBin\heat.exe" @heatArgs
          if ($LASTEXITCODE -ne 0) { throw "heat.exe failed with exit code $LASTEXITCODE" }

      - name: Build MSI
        shell: pwsh
        env:
          WIX_BIN: ${{ steps.wix.outputs.bin }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $wixBin = $env:WIX_BIN
          $srcDir = (Resolve-Path native\publish\win-x64-folder).Path
          $version = $env:VERSION

          $candleArgs = @(
            "-arch", "x64",
            "-dClypDatVersion=$version",
            "-dClypDatSourceDir=$srcDir",
            "-ext", "WixUtilExtension", "-ext", "WixUIExtension",
            "installer\Product.wxs", "installer\AppFiles.wxs",
            "-out", "installer\"
          )
          & "$wixBin\candle.exe" @candleArgs
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed with exit code $LASTEXITCODE" }

          $lightArgs = @(
            "-ext", "WixUtilExtension", "-ext", "WixUIExtension",
            "installer\Product.wixobj", "installer\AppFiles.wixobj",
            # heat.exe authors file KeyPaths without Win64 metadata; suppress
            # the known per-user validation warnings for harvested components.
            "-out", "ClypDat.msi", "-sice:ICE61", "-sice:ICE38", "-sice:ICE64"
          )
          & "$wixBin\light.exe" @lightArgs
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed with exit code $LASTEXITCODE" }

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            ClypDat-win-x64.zip
            ClypDat-Portable.exe
            ClypDat-Setup.exe
            ClypDat.msi
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  upload:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      # Create a draft rather than publishing an incomplete release. GitHub immutable
      # releases cannot accept assets after publication, while ClypDat's updater refuses
      # a release until its signed manifest is present. The offline signer uploads both
      # manifest files to this draft, sets the final notes, then publishes it.
      # ClypDat's updater verifies ClypDat-Release.manifest.json against a key pinned in
      # the binary, and once that key is set a release without the manifest is REFUSED by
      # the updater. Signing is deliberately not done here: the private key must never
      # reach CI, because a key that lives where the download URL is served proves
      # nothing. After this workflow finishes, run locally:
      #
      #   gh release download <tag> --repo ClypLabs/ClypDat --dir .\artifacts
      #   .\eng\Sign-ReleaseManifest.ps1 -Tag <tag> -ArtifactDirectory .\artifacts -PrivateKeyPath <offline key>
      #   gh release upload <tag> .\artifacts\ClypDat-Release.manifest.json .\artifacts\ClypDat-Release.manifest.sig --repo ClypLabs/ClypDat
      #
      # Then re-run the mirror sync so the mirror serves the manifest too.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: pwsh
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw "Unexpected tag '$tag' from build job." }
          Set-Location release-assets
          gh release create $tag `
            ClypDat-win-x64.zip ClypDat-Portable.exe ClypDat-Setup.exe ClypDat.msi `
            --title "ClypDat $tag" `
            --generate-notes `
            --verify-tag `
            --draft
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
