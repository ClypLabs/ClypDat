stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/i'
    - when: never

variables:
  GIT_DEPTH: "0"
  # Set reviewed notes when manually publishing this exact release.
  RELEASE_DESCRIPTION: ""

build_windows_installer:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - '$version = $env:CI_COMMIT_TAG.Substring(1)'
    - .\dotnet.ps1 --info
    - |
      $pin = [xml](Get-Content eng\AvaloniaPin.props -Raw)
      $avaloniaCommit = $pin.SelectSingleNode('//ClypDatAvaloniaStableCommit').InnerText
      $avaloniaVersion = $pin.SelectSingleNode('//ClypDatAvaloniaStablePackageVersion').InnerText
      $avaloniaRoot = Join-Path (Split-Path $PWD -Parent) 'clypdat-avalonia'
      $env:GIT_TERMINAL_PROMPT = '0'
      git clone --no-checkout https://gitlab.com/clypdat-group1/clypdat-avalonia.git $avaloniaRoot
      if ($LASTEXITCODE -ne 0) { Write-Error 'Could not clone ClypDat Avalonia fork.'; exit 1 }
      git -C $avaloniaRoot fetch --depth 1 origin $avaloniaCommit
      if ($LASTEXITCODE -ne 0) { Write-Error "Could not fetch pinned Avalonia commit $avaloniaCommit."; exit 1 }
      git -C $avaloniaRoot checkout --detach $avaloniaCommit
      if ($LASTEXITCODE -ne 0) { Write-Error "Could not check out pinned Avalonia commit $avaloniaCommit."; exit 1 }
      git -C $avaloniaRoot submodule update --init --recursive
      if ($LASTEXITCODE -ne 0) { Write-Error 'Could not initialize Avalonia submodules.'; exit 1 }
      $env:NUGET_PACKAGES = Join-Path $env:TEMP ("clypdat-nuget-" + $env:CI_PIPELINE_ID)
      .\eng\Build-ReleaseAvaloniaPackages.ps1 -AvaloniaRoot $avaloniaRoot
    # CLYPDAT_TEST_GPU stays unset: shared runners have no GPU, and the physical
    # D3D11 tests skip themselves without it.
    - >-
      .\dotnet.ps1 test native\tests\ClypDat.App.Tests\ClypDat.App.Tests.csproj
      -c Release -p:Platform=x64 --nologo
    - >-
      .\dotnet.ps1 publish native\src\ClypDat.App\ClypDat.App.csproj
      -c Release -r win-x64 --self-contained true -p:Platform=x64
      -p:Version=$version -o native\publish\win-x64-folder --nologo
    - .\eng\Test-SelfContainedPublish.ps1 -PublishDirectory native\publish\win-x64-folder
    - |
      foreach ($tool in @(
        @{ Name = 'nsis'; Version = '3.12.0' },
        @{ Name = 'wixtoolset'; Version = '3.14.1.20250415' },
        @{ Name = '7zip'; Version = '26.3.0' }
      )) {
        choco upgrade $tool.Name --version $tool.Version --allow-downgrade -y --no-progress --requirechecksums
        if ($LASTEXITCODE -ne 0) { throw "Pinned $($tool.Name) installation failed." }
      }
    - |
      if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { throw "NSIS was not installed." }
      if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) { throw "7-Zip was not installed." }
    - >-
      Compress-Archive -Path native\publish\win-x64-folder\* -DestinationPath ClypDat-win-x64.zip
    - |
      $sevenZip = "C:\Program Files\7-Zip\7z.exe"
      $sfxModule = "C:\Program Files\7-Zip\7z.sfx"
      & $sevenZip a -mx=5 payload.7z ".\native\publish\win-x64-folder\*"
      if ($LASTEXITCODE -ne 0) { throw "7-Zip archive creation failed." }
      $configLines = @(
        ';!@Install@!UTF-8!',
        'Title="ClypDat"',
        'RunProgram="ClypDat.exe"',
        ';!@InstallEnd@!'
      )
      [System.IO.File]::WriteAllText("sfx-config.txt", ($configLines -join "`r`n"), [System.Text.Encoding]::UTF8)
      cmd /c copy /b "$sfxModule" + sfx-config.txt + payload.7z ClypDat-Portable.exe
      if ($LASTEXITCODE -ne 0) { throw "Portable executable creation failed." }
    - >-
      & "C:\Program Files (x86)\NSIS\makensis.exe"
      /DCLYPDAT_VERSION=$version
      /DCLYPDAT_SOURCE_DIR=..\native\publish\win-x64-folder
      /DCLYPDAT_OUTPUT_FILE=..\ClypDat-Setup.exe
      installer\ClypDat.nsi
    - 'if (-not (Test-Path -LiteralPath ClypDat-Setup.exe)) { throw "ClypDat-Setup.exe was not created." }'
    - |
      $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\heat.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
      if (-not $found) {
        $found = Get-ChildItem "C:\Program Files\WiX Toolset*\bin\heat.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
      }
      if (-not $found) { throw "Could not locate WiX Toolset's bin directory (heat.exe)." }
      $wixBin = $found.DirectoryName
      & "$wixBin\heat.exe" dir native\publish\win-x64-folder -cg AppFiles -dr INSTALLFOLDER -srd -sreg -gg -g1 -sfrag -var var.ClypDatSourceDir -out installer\AppFiles.wxs
      if ($LASTEXITCODE -ne 0) { throw "heat.exe failed with exit code $LASTEXITCODE" }
      $srcDir = (Resolve-Path native\publish\win-x64-folder).Path
      & "$wixBin\candle.exe" -arch x64 -dClypDatVersion=$version -dClypDatSourceDir=$srcDir -ext WixUtilExtension -ext WixUIExtension installer\Product.wxs installer\AppFiles.wxs -out installer\
      if ($LASTEXITCODE -ne 0) { throw "candle.exe failed with exit code $LASTEXITCODE" }
      $msiPath = Join-Path $PWD 'ClypDat.msi'
      & "$wixBin\light.exe" -ext WixUtilExtension -ext WixUIExtension installer\Product.wixobj installer\AppFiles.wixobj -out $msiPath -sice:ICE61 -sice:ICE38 -sice:ICE64
      if ($LASTEXITCODE -ne 0) { throw "light.exe failed with exit code $LASTEXITCODE" }
      if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) { throw "MSI was not created: $msiPath" }
      if ((Get-Item -LiteralPath $msiPath).Length -le 0) { throw "MSI is empty: $msiPath" }
    - |
      $assets = @("ClypDat-win-x64.zip", "ClypDat-Portable.exe", "ClypDat-Setup.exe", "ClypDat.msi")
      foreach ($asset in $assets) {
        if (-not (Test-Path -LiteralPath $asset)) { throw "$asset was not created." }
        Get-FileHash -Algorithm SHA256 $asset | Format-List
      }
  artifacts:
    name: "ClypDat-$CI_COMMIT_TAG"
    paths:
      - ClypDat-win-x64.zip
      - ClypDat-Portable.exe
      - ClypDat-Setup.exe
      - ClypDat.msi
    expire_in: 1 year

# Manual on purpose. The release manifest is signed offline and this pipeline
# cannot produce it, and ClypDat's updater reads GitLab releases as an update
# source. Publishing automatically put a GitLab release ahead of its signed
# manifest. Before running this job, download this pipeline's artifacts, sign
# them with eng\Sign-ReleaseManifest.ps1, and pass the two outputs as base64 in
# the RELEASE_MANIFEST_B64 and RELEASE_SIGNATURE_B64 job variables. The GitHub
# release's manifest does not fit here: it covers GitHub's build, not these bytes.
publish_gitlab_release:
  stage: release
  when: manual
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: build_windows_installer
      artifacts: true
  script:
    - |
      if ([string]::IsNullOrWhiteSpace($env:RELEASE_DESCRIPTION)) { throw 'Provide reviewed release notes in RELEASE_DESCRIPTION.' }
      $packageBase = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/clypdat/$env:CI_COMMIT_TAG"
      $assets = @("ClypDat-win-x64.zip", "ClypDat-Portable.exe", "ClypDat-Setup.exe", "ClypDat.msi")
      if ([string]::IsNullOrWhiteSpace($env:RELEASE_MANIFEST_B64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_SIGNATURE_B64)) {
        throw 'A signed release manifest and signature are required before publishing, including for legacy clients.'
      }
      [IO.File]::WriteAllBytes((Join-Path $PWD 'ClypDat-Release.manifest.json'), [Convert]::FromBase64String($env:RELEASE_MANIFEST_B64.Trim()))
      [IO.File]::WriteAllBytes((Join-Path $PWD 'ClypDat-Release.manifest.sig'), [Convert]::FromBase64String($env:RELEASE_SIGNATURE_B64.Trim()))
      $releaseManifest = .\eng\Read-VerifiedReleaseManifest.ps1 -ManifestPath ClypDat-Release.manifest.json -SignaturePath ClypDat-Release.manifest.sig -Tag $env:CI_COMMIT_TAG
      foreach ($asset in $assets) {
        $entries = @($releaseManifest.assets | Where-Object { $_.name -ceq $asset })
        if ($entries.Count -ne 1) { throw "Signed release manifest must cover $asset exactly once." }
        $entry = $entries[0]
        if ((Get-Item -LiteralPath $asset).Length -ne $entry.size -or
            (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne ([string]$entry.sha256).ToLowerInvariant()) {
          throw "Signed release manifest does not match $asset from this pipeline."
        }
      }
      $signedAssets = @('ClypDat-Release.manifest.json', 'ClypDat-Release.manifest.sig')
      $assets += $signedAssets
      foreach ($asset in $assets) {
        $packageUrl = "$packageBase/$asset"
        curl.exe --fail --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $asset $packageUrl
        if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset." }
      }
      $releaseUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
      $releaseLinks = @(
        @{ name = 'ClypDat-win-x64.zip'; url = "$packageBase/ClypDat-win-x64.zip"; direct_asset_path = '/ClypDat-win-x64.zip'; link_type = 'package' },
        @{ name = 'ClypDat-Portable.exe'; url = "$packageBase/ClypDat-Portable.exe"; direct_asset_path = '/ClypDat-Portable.exe'; link_type = 'package' },
        @{ name = 'ClypDat-Setup.exe'; url = "$packageBase/ClypDat-Setup.exe"; direct_asset_path = '/ClypDat-Setup.exe'; link_type = 'package' },
        @{ name = 'ClypDat.msi'; url = "$packageBase/ClypDat.msi"; direct_asset_path = '/ClypDat.msi'; link_type = 'package' }
      )
      foreach ($signedAsset in $signedAssets) {
        $releaseLinks += @{ name = $signedAsset; url = "$packageBase/$signedAsset"; direct_asset_path = "/$signedAsset"; link_type = 'other' }
      }
      $releasePayload = @{
        tag_name = $env:CI_COMMIT_TAG
        name = "ClypDat $env:CI_COMMIT_TAG"
        description = $env:RELEASE_DESCRIPTION
        assets = @{ links = $releaseLinks }
      } | ConvertTo-Json -Depth 6
      $releaseHeaders = @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN }
      try {
        Invoke-RestMethod -Uri $releaseUrl -Method Post -Headers $releaseHeaders -ContentType 'application/json' -Body $releasePayload | Out-Null
      }
      catch {
        if ($_.Exception.Response.StatusCode.value__ -ne 409) { throw }
        $tagUrl = "$releaseUrl/$([uri]::EscapeDataString($env:CI_COMMIT_TAG))"
        Invoke-RestMethod -Uri $tagUrl -Method Put -Headers $releaseHeaders -ContentType 'application/json' -Body $releasePayload | Out-Null
      }
